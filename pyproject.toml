[project]
name = "ucpc"
version = "0.2.0"
description = "Background screenshot-to-text assistant for Windows"
requires-python = ">=3.11"
dependencies = [
  "mss>=10,<11",
  "openai>=2,<3",
  "Pillow>=11,<13",
  "PySide6>=6.8,<7",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pywin32>=311; sys_platform == 'win32'",
  "filelock>=3.30,<4",
  "Pygments>=2.21,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.22,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["stress: deterministic load, concurrency and memory tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

